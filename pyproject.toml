[project]
name = "stealth-browser-mcp"
version = "0.3.0"
description = "Hardened undetectable browser automation MCP server with CDP-level access"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MechCP Team", email = "team@mechcp.local"},
]

# Runtime dependencies. Versions are pinned for reproducibility; bump only
# after reviewing the upstream changelog because we run AI-supplied code in a
# validated sandbox and depend on stable behavior across these libraries.
#
# `py2js` is currently sourced from a third-party fork. Before publishing,
# vendor an audited copy of this package and replace the URL below; pinning
# to a SHA does NOT prevent a maintainer-controlled force-push from changing
# the contents at that SHA.
dependencies = [
    "fastmcp==2.11.2",
    "nodriver==0.47.0",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "py2js @ git+https://github.com/am230/py2js.git@31a83c7c25a51ab0cc3255f484a2279d26278ec3",
    "jsbeautifier==1.15.4",
    "strinpy==0.0.4",
    "strbuilder==1.1.3",
    "psutil==7.0.0",
    "pillow==11.3.0",
    "requests==2.32.3",
    "uvicorn[standard]==0.35.0",
]

# Development dependencies (optional)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

# Repository metadata
[project.urls]
Homepage = "https://github.com/mechcp/stealth-browser-mcp"
Documentation = "https://github.com/mechcp/stealth-browser-mcp#readme"
Repository = "https://github.com/mechcp/stealth-browser-mcp.git"
Issues = "https://github.com/mechcp/stealth-browser-mcp/issues"

# Code formatting
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
